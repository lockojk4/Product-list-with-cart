<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart</title>
    <link rel="stylesheet" href="./styles/index.css">
</head>
<body>
    <div class="container single-column">
        <aside class="cart-section" style="width: 100%;">
            <a href="index.html" class="back-link">← Back to Menu</a>
            <div class="cart-card mt-2">
                <h2 id="cart-title">Your Cart (0)</h2>
                <div id="cart-items">
                    <div class="empty-cart-container">
    <img src="./assets/images/illustration-empty-cart.svg" alt="Empty Cart" class="empty-cart-img">
    <p class="empty-msg">Your added items will appear here</p>
</div>
                </div>
                <div class="cart-total-wrapper" id="cart-total-wrapper" style="display:none;">
                    <div class="order-total">
                        <span>Order Total</span>
                        <strong id="cart-total-price">$0.00</strong>
                    </div>

                    <!-- New Carbon Neutral Message -->
                    <div class="carbon-neutral-msg">
                        <img src="./assets/images/icon-carbon-neutral.svg" alt="Carbon Neutral Tree Icon">
                              <p>This is a <strong>carbon-neutral</strong> delivery</p>
                    </div>

                    <button class="confirm-btn" id="confirm-order-btn">Confirm Order</button>
                </div>
            </div>
        </aside>
    </div>

    <script type="module" src="./scripts/index.js"></script>

    <!-- Order Confirmation Modal -->
    <div id="confirmation-modal-overlay" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <img src="./assets/images/icon-order-confirmed.svg" alt="Order Confirmed" class="modal-icon">
            <h2 class="modal-title">Order Confirmed</h2>
            <p class="modal-subtitle">We hope you enjoy your food!</p>
            
            <div class="modal-order-summary">
                <div id="modal-items-list">
                    <!-- Cart items with thumbnails injected here -->
                </div>
                <div class="modal-order-total">
                    <span>Order Total</span>
                    <strong id="modal-total-price">$0.00</strong>
                </div>
            </div>
            
            <button id="start-new-order-btn" class="confirm-btn">Start New Order</button>
        </div>
    </div>
</body>
</html>
